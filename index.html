                content: `# Selected Publications

### [DisCo-DSO](https://ojs.aaai.org/index.php/AAAI/article/view/34919) (AAAI 2025)
**Coupling Discrete and Continuous Optimization for Efficient Generative Design in Hybrid Spaces**

We consider the challenge of black-box optimization within hybrid discrete-continuous and variable-length spaces, a problem that arises in various applications, such as decision tree learning and symbolic regression. We propose DisCo-DSO (Discrete-Continuous Deep Symbolic Optimization), a novel approach that uses a generative model to learn a joint distribution over discrete and continuous design variables to sample new hybrid designs. In contrast to standard decoupled approaches, in which the discrete and continuous variables are optimized separately, our joint optimization approach uses fewer objective function evaluations, is robust against non-differentiable objectives, and learns from prior samples to guide the search, leading to significant improvement in performance and sample efficiency. Our experiments on a diverse set of optimization tasks demonstrate that the advantages of DisCo-DSO become increasingly evident as problem complexity grows. In particular, we illustrate DisCo-DSO's superiority over the state-of-the-art methods for interpretable reinforcement learning with decision trees.

### [Deep Symbolic Optimization](https://arxiv.org/abs/2505.10762) (arXiv 2025)
**Reinforcement Learning for Symbolic Mathematics**

Deep Symbolic Optimization (DSO) is a novel computational framework that enables symbolic optimization for scientific discovery, particularly in applications involving the search for intricate symbolic structures. One notable example is equation discovery, which aims to automatically derive mathematical models expressed in symbolic form. In DSO, the discovery process is formulated as a sequential decision-making task. A generative neural network learns a probabilistic model over a vast space of candidate symbolic expressions, while reinforcement learning strategies guide the search toward the most promising regions. This approach integrates gradient-based optimization with evolutionary and local search techniques, and it incorporates in-situ constraints, domain-specific priors, and advanced policy optimization methods. The result is a robust framework capable of efficiently exploring extensive search spaces to identify interpretable and physically meaningful models. Extensive evaluations on benchmark problems have demonstrated that DSO achieves state-of-the-art performance in both accuracy and interpretability. In this chapter, we provide a comprehensive overview of the DSO framework and illustrate its transformative potential for automating symbolic optimization in scientific discovery.

### [Combinatorial Optimization of Antibody Libraries](https://openreview.net/forum?id=jTtFqc2qnJ) (AAMAS 2025)
**Antibody Library Design by Seeding Linear Programming with Inverse Folding and Protein Language Models**

Designing effective antibody libraries is a challenging combinatorial search problem in computational biology. We propose a novel integer linear programming (ILP) method that explicitly controls diversity and affinity objectives when generating candidate libraries. Our approach formulates library design as a constrained optimization: we encode diversity parameters and predicted binding scores (from in silico deep mutational scanning and protein language models) as ILP constraints and objectives. This enables automated search for high-quality, diverse antibody sequences under explicit experimental constraints. We demonstrate the method on cold-start design tasks for Trastuzumab, D44.1, and Spesolimab, showing that our optimized libraries outperform baseline designs in both predicted affinity and sequence diversity. This hybrid search-and-learning framework illustrates how constrained optimization and predictive modeling can be combined to deliver interpretable, high-quality solutions to antibody library engineering.

### [Protein Language Models for Antibody Thermostability](https://openreview.net/forum?id=sFNomCGcA8) (NeurIPS 2025)
**Not all representations are equal: Comparing protein language models for antibody thermostability prediction**

Predicting antibody thermostability is an important and challenging task in computational antibody design. Antibodies which are not thermostable may be incompatible with mass production and distribution. To this end, we assess how different protein language model (pLM) representations affect performance in the downstream task of predicting antibody thermostability. Our findings demonstrate that the choice of pLM has a large effect on predictor performance, even when data, model size, and hyperparameters are held stable. We also show that a performance boost may be obtained by combining pLM representations

### [Learning Sparse Symbolic Policies for Sepsis Treatment](https://www.osti.gov/servlets/purl/1810686) (ICML 2021)
**Developing interpretable, sparse symbolic policies for medical decision-making**

Sepsis is a life-threatening organ dysfunction caused by a dysregulated host response to infection. Despite its severity, no FDA-approved drug treatments exists. Recent work controlling sepsis simulations with deep reinforcement learning have successfully discovered effective cytokine mediation strategies. However, the performance of these neural-network based policies comes at the expense of their deployability in clinical settings, where sparsity and interpretability are required characteristics. To this end, we propose a pipeline to learn simple, sparse symbolic policies represented by constants and/or succinct, humanreadable expressions. We demonstrate our approach by learning a sparse symbolic policy that is efficacious on simulated sepsis patients.

### [Increasing Performance of EVs in Ride-Hailing](https://arxiv.org/abs/1912.03408) (arXiv 2019)
**Deep reinforcement learning for electric vehicle fleet management**

New forms of on-demand transportation such as ride-hailing and connected autonomous vehicles are proliferating, yet are a challenging use case for electric vehicles (EV). This paper explores the feasibility of using deep reinforcement learning (DRL) to optimize a driving and charging policy for a ride-hailing EV agent, with the goal of reducing costs and emissions while increasing transportation service provided. We introduce a data-driven simulation of a ride-hailing EV agent that provides transportation service and charges energy at congested charging infrastructure. We then formulate a test case for the sequential driving and charging decision making problem of the agent and apply DRL to optimize the agent's decision making policy. We evaluate the performance against hand-written policies and show that our agent learns to act competitively without any prior knowledge`

        function Sidebar({ fileTree, expandedFolders, setExpandedFolders, selectedFile, setSelectedFile, sidebarExpanded, setSidebarExpanded }) {
            const allExpanded = Object.values(expandedFolders).every(v => v);
            
            const toggleFolder = (name) => {
                setExpandedFolders(prev => ({
                    ...prev,
                    [name]: !prev[name]
                }));
            };
            
            const toggleAll = () => {
                const newState = !allExpanded;
                const newExpanded = {};
                const collectFolders = (node) => {
                    if (node.children) {
                        newExpanded[node.name] = newState;
                        node.children.forEach(collectFolders);
                    }
                };
                collectFolders(fileTree);
                setExpandedFolders(newExpanded);
            };

            const renderTree = (node, depth = 0) => {
                if (node.children) {
                    const isExpanded = expandedFolders[node.name];
                    return (
                        <div key={node.name}>
                            <div
                                className={`flex items-center px-3 py-1.5 cursor-pointer select-none touch-manipulation hover:bg-[#3c3836] ${
                                    depth === 0 ? 'font-bold text-[#ebdbb2]' : ''
                                }`}
                                onClick={() => toggleFolder(node.name)}
                            >
                                <span className="mr-1 w-4 text-[#fabd2f]">
                                    {isExpanded ? '▾' : '▸'}
                                </span>
                                <span className="text-sm">{node.name}</span>
                            </div>
                            {isExpanded && (
                                <div className="ml-2">
                                    {node.children.map(child => renderTree(child, depth + 1))}
                                </div>
                            )}

                    );
                } else {
                    const isSelected = selectedFile === node.name;
                    return (
                        <div

        function JSONContent({ content }) {
            const lines = content.split('\n');
            return (
                <div className="text-sm font-mono leading-relaxed">
                    {lines.map((line, i) => (
                        <div key={i} className="flex">
                            <span className="text-[#7c6f64] w-8 flex-shrink-0 text-right pr-2 select-none">{i + 1}</span>
                            <span className="flex-1 break-words whitespace-pre-wrap">{renderJSONLine(line)}</span>
                        </div>
                    ))}
                </div>
            );
        }

        function renderJSONLine(line) {
            const parts = [];
            let current = '';
            let i = 0;
            while (i < line.length) {
                if (line[i] === '"' && (i === 0 || line[i-1] !== '\\')) {
                    if (current) { parts.push(<span key={parts.length}>{current}</span>); current = ''; }
                    let j = i + 1;
                    while (j < line.length && (line[j] !== '"' || line[j-1] === '\\')) j++;
                    parts.push(<span key={parts.length} className="syntax-variable">{line.substring(i, j+1)}</span>);
                    i = j + 1;
                } else if (line[i] === ':') {
                    if (current) { parts.push(<span key={parts.length}>{current}</span>); current = ''; }
                    parts.push(<span key={parts.length} className="syntax-operator">{line[i]}</span>);
                    i++;
                } else if (['{', '}', '[', ']'].includes(line[i])) {
                    if (current) { parts.push(<span key={parts.length}>{current}</span>); current = ''; }
                    parts.push(<span key={parts.length} className="syntax-punctuation">{line[i]}</span>);
                    i++;
                } else {
                    current += line[i];
                    i++;
                }
            }
            if (current) parts.push(<span key={parts.length}>{current}</span>);
            return <span>{parts}</span>;
        }

        function PythonContent({ content }) {
            const lines = content.split('\n');
            return (

                    {lines.map((line, i) => (
                        <div key={i} className="flex">
                            <span className="text-[#7c6f64] w-8 flex-shrink-0 text-right pr-2 select-none">{i + 1}</span>
                            <span className="flex-1 break-words whitespace-pre-wrap">{renderPythonLine(line)}</span>
                        </div>
                    ))}
                </div>
            );
        }

        function renderPythonLine(line) {
            const keywords = ['def', 'if', 'else', 'for', 'while', 'return', 'import', 'from', 'class', 'True', 'False', 'None', 'and', 'or', 'not', 'in', 'as', 'try', 'except', 'with'];
            const parts = [];
            let current = '';
            let i = 0;
            
            while (i < line.length) {
                if (line[i] === '#') {
                    if (current) { parts.push(<span key={parts.length}>{current}</span>); current = ''; }
                    parts.push(<span key={parts.length} className="syntax-comment">{line.substring(i)}</span>);
                    break;
                } else if (line[i] === '"' || line[i] === "'") {
                    if (current && !keywords.includes(current)) {
                        parts.push(<span key={parts.length}>{current}</span>);
                    } else if (keywords.includes(current)) {
                        parts.push(<span key={parts.length} className="syntax-keyword">{current}</span>);
                    }
                    current = '';
                    let quote = line[i];
                    let j = i + 1;
                    while (j < line.length && (line[j] !== quote || line[j-1] === '\\')) j++;
                    parts.push(<span key={parts.length} className="syntax-string">{line.substring(i, j+1)}</span>);
                    i = j + 1;
                } else if (/\s/.test(line[i])) {
                    if (current && !keywords.includes(current)) {
                        parts.push(<span key={parts.length}>{current}</span>);
                    } else if (keywords.includes(current)) {
                        parts.push(<span key={parts.length} className="syntax-keyword">{current}</span>);
                    }
                    current = '';
                    parts.push(<span key={parts.length}>{line[i]}</span>);
                    i++;
                } else {
                    current += line[i];
                    i++;
                }
            }
            if (current && !keywords.includes(current)) {
                parts.push(<span key={parts.length}>{current}</span>);
            } else if (keywords.includes(current) && current !== 'in' && current !== 'as') {
                parts.push(<span key={parts.length} className="syntax-keyword">{current}</span>);
            }
            return <span>{parts}</span>;
        }

        function BibtexContent({ content }) {
            const lines = content.split('\n');
            return (
                <div className="text-sm font-mono leading-relaxed">
                    {lines.map((line, i) => (
                        <div key={i} className="flex">
                            <span className="text-[#7c6f64] w-8 flex-shrink-0 text-right pr-2 select-none">{i + 1}</span>
                            <span className="flex-1 break-words whitespace-pre-wrap">{renderBibtexLine(line)}</span>
                        </div>
                    ))}
                </div>
            );
        }

        function renderBibtexLine(line) {
            if (line.startsWith('@')) {
                return <span className="syntax-keyword">{line}</span>;
            }
            if (line.includes('=')) {
                const [key, ...valueParts] = line.split('=');
                return (
                    <span>
                        <span className="syntax-type">{key.trim()}</span>
                        <span className="syntax-operator">=</span>
                        <span className="syntax-string">{valueParts.join('=')}</span>
                    </span>
                );
            }
            return <span className="syntax-comment">{line}</span>;
        }

        const proteins = [
            { id: '1N8Z', name: 'Antibody-Antigen Complex' },
            { id: '1aki', name: 'Horse Heart Myoglobin' },
            { id: '1MLC', name: 'Antibody Fragment' },
            { id: '2VSM', name: 'Immunoglobulin Structure' },
            { id: '9GLZ', name: 'Engineered Antibody' },
            { id: '9EZV', name: 'Monoclonal Antibody' },
            { id: '9Z5Q', name: 'Antibody Fragment' }
        ];

        function MarkdownContent({ content }) {
            const [selectedProtein, setSelectedProtein] = useState('1N8Z');
            const [isMobile, setIsMobile] = useState(false);
            const lines = content.split('\n');
            
            useEffect(() => {
                setIsMobile(window.innerWidth < 768);
            }, []);
            
            const proteins = [
                { id: '1N8Z', name: 'Antibody-Antigen Complex' },
                { id: '1AKI', name: 'Horse Heart Myoglobin' },
                { id: '1MLC', name: 'Antibody Fragment' },
                { id: '2VSM', name: 'Immunoglobulin Structure' },
                { id: '9GLZ', name: 'Engineered Antibody' },
                { id: '9EZV', name: 'Monoclonal Antibody' },
                { id: '9Z5Q', name: 'Antibody Fragment' }
            ];
            
            const getImageUrl = (pdbId) => {
                return `images/${pdbId.toUpperCase()}.png`;
            };
            
            return (
                <div className="text-sm font-mono leading-relaxed">
                    {lines.map((line, i) => {
                        if (line === '[[PROTEIN_VIEWER]]') {
                            return (
                                <div key={i} className="mb-4 -ml-8">
                                    <div className="flex items-center justify-between bg-[#282828] px-4 py-2 border-b border-[#504945]">
                                        <div className="flex items-center">
                                            <span className="text-sm text-[#ebdbb2]">"antibody_structure.pdb"</span>
                                            <span className="ml-2 text-xs text-[#7c6f64]">| PDB:</span>
                                            <select
                                                value={selectedProtein}
                                                onChange={(e) => setSelectedProtein(e.target.value)}
                                                className="ml-2 bg-[#3c3836] text-[#ebdbb2] text-xs px-2 py-1 border border-[#504945] rounded cursor-pointer focus:outline-none focus:border-[#fabd2f]"
                                            >
                                                {proteins.map(p => (
                                                    <option key={p.id} value={p.id}>{p.id} - {p.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                    {isMobile ? (
                                        <div className="h-[320px] md:h-80 border border-[#504945] flex items-center justify-center bg-[#1e1e1e]">
                                            <img
                                                src={getImageUrl(selectedProtein)}
                                                alt={`Protein structure: ${selectedProtein}`}
                                                className="max-h-full max-w-full object-contain"
                                                onError={(e) => {
                                                    e.target.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320"><rect fill="#282828" width="320" height="320"/><text fill="#7c6f64" font-family="monospace" font-size="14" x="50%" y="50%" text-anchor="middle" dy=".3em">Image not available</text></svg>');
                                                }}
                                            />
                                        </div>
                                    ) : (
                                        <div 
                                            className="h-[320px] md:h-80 border border-[#504945] relative"
                                            onClick={(e) => {
                                                e.currentTarget.querySelector('iframe').click();
                                            }}
                                        >
                                            <iframe
                                                src={`https://molstar.org/viewer/?pdb=${selectedProtein}&collapse=1&hide-controls=1`}
                                                title="Protein Structure Viewer"
                                                className="w-full h-full absolute inset-0"
                                                style={{ border: 'none' }}
                                                loading="lazy"
                                            />
                                        </div>
                                    )}
                                </div>
                            );
                        }
                        return (
                            <div key={i} className="flex">
                                <span className="text-[#7c6f64] w-8 flex-shrink-0 text-right pr-2 select-none">{i + 1}</span>
                                <span className="flex-1 break-words whitespace-pre-wrap">{renderMarkdownLine(line)}</span>
                            </div>
                        );
                    })}
                </div>
            );
        }

        function renderMarkdownLine(line) {
            if (line.startsWith('# ')) {
                return <span className="syntax-heading text-lg block">{line}</span>;
            }
            if (line.startsWith('## ')) {
                return <span className="syntax-heading text-base block">{line}</span>;
            }
            if (line.startsWith('### ')) {
                return <span className="syntax-heading text-sm block">{line}</span>;
            }
            if (line.startsWith('- ')) {
                const content = line.substring(2);
                const linkResult = processInlineLinks(content);
                return <span><span className="syntax-operator">-</span><span> </span>{linkResult}</span>;
            }
            if (line.startsWith('  - ')) {
                const content = line.substring(4);
                const linkResult = processInlineLinks(content);
                return <span><span className="syntax-operator">  -</span><span> </span>{linkResult}</span>;
            }
            if (line.startsWith('**') && line.endsWith('**')) {
                return <span className="syntax-bold">{line}</span>;
            }
            if (line.startsWith('`') && line.endsWith('`')) {
                return <span className="syntax-string">{line}</span>;
            }
            
            return processInlineLinks(line);
        }
        
        function processInlineLinks(text) {
            const internalExtensions = ['.md', '.json', '.bib', '.txt', '.py', '.pdb'];
            
            // Handle markdown link syntax: [text](url)
            const linkMatch = text.match(/\[([^\]]+)\]\(([^)]+)\)/);
            if (linkMatch) {
                const linkText = linkMatch[1];
                const url = linkMatch[2];
                const isInternal = internalExtensions.some(ext => url.endsWith(ext));
                
                return (
                    <span>
                        {text.substring(0, linkMatch.index)}
                        <a 
                            href={isInternal ? '#' : url}
                            target={isInternal ? '_self' : '_blank'}
                            rel="noopener noreferrer"
                            className="syntax-link hover:opacity-80"
                            onClick={(e) => {
                                if (isInternal) {
                                    e.preventDefault();
                                    window.dispatchEvent(new CustomEvent('openFile', { detail: url }));
                                }
                            }}
                        >
                            {linkText}
                        </a>
                        {processInlineLinks(text.substring(linkMatch.index + linkMatch[0].length))}
                    </span>
                );
            }
            
            // Handle plain URLs
            const urlMatch = text.match(/(https?:\/\/[^\s]+)/);
            if (urlMatch) {
                const url = urlMatch[1];
                const before = text.substring(0, urlMatch.index);
                const after = text.substring(urlMatch.index + url.length);
                return (
                    <span>
                        {before}
                        <a 
                            href={url} 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="syntax-link hover:opacity-80"
                        >
                            {url}
                        </a>
                        {processInlineLinks(after)}
                    </span>
                );
            }
            
            return <span className="text-[#ebdbb2]">{text}</span>;
        }

        function ProteinViewer({ initialPdbId }) {
            const [selectedProtein, setSelectedProtein] = useState(initialPdbId || '1N8Z');
            const proteins = [
                { id: '1N8Z', name: 'Antibody-Antigen Complex' },
                { id: '1aki', name: 'Horse Heart Myoglobin' },
                { id: '1MLC', name: 'Antibody Fragment' },
                { id: '2VSM', name: 'Immunoglobulin Structure' },
                { id: '9GLZ', name: 'Engineered Antibody' },
                { id: '9EZV', name: 'Monoclonal Antibody' },
                { id: '9Z5Q', name: 'Antibody Fragment' }
            ];

            const currentProtein = proteins.find(p => p.id === selectedProtein) || proteins[0];

            return (
                <div className="h-full flex flex-col">
                    <div className="flex items-center justify-between bg-[#282828] px-4 py-2 border-b border-[#504945]">
                        <div className="flex items-center">
                            <span className="text-sm text-[#ebdbb2]">"antibody_structure.pdb"</span>
                            <span className="ml-2 text-xs text-[#7c6f64]">| PDB:</span>
                            <select
                                value={selectedProtein}
                                onChange={(e) => setSelectedProtein(e.target.value)}
                                className="ml-2 bg-[#3c3836] text-[#ebdbb2] text-xs px-2 py-1 border border-[#504945] rounded cursor-pointer focus:outline-none focus:border-[#fabd2f]"
                            >
                                {proteins.map(p => (
                                    <option key={p.id} value={p.id}>{p.id} - {p.name}</option>
                                ))}
                            </select>
                        </div>
                    </div>
                    <div className="flex-1 flex flex-col">
                        <div className="flex-1 bg-[#282828] relative">
                            <iframe
                                src={`https://molstar.org/viewer/?pdb=${selectedProtein}&collapse=1&hide-controls=1`}
                                title="Protein Structure Viewer"
                                className="w-full h-full absolute inset-0"
                                style={{ border: 'none' }}
                                loading="lazy"
                            />
                        </div>
                        <div className="bg-[#3c3836] px-4 py-3 border-t border-[#504945]">
                            <h3 className="text-[#ebdbb2] font-medium mb-1">{currentProtein.name}</h3>
                            <p className="text-[#a89984] text-sm">PDB: {selectedProtein.toUpperCase()}</p>
                        </div>
                    </div>
                </div>
            );
        }

        function StatusLine({ selectedFile, openTabs, message }) {
            const currentFile = fileContent[selectedFile];
            const mode = 'NORMAL';
            const displayMessage = message || `${openTabs.length} buffer(s) -- ${currentFile ? currentFile.title : 'No file'}`;
            
            return (
                <div className="h-6 flex items-center text-xs">
                    <div className="bg-[#b8bb26] text-[#282828] px-3 font-bold">
                        {mode}
                    </div>
                    <div className="bg-[#3c3836] text-[#ebdbb2] px-3 flex-1 truncate border-l border-[#504945]">
                        {displayMessage}
                    </div>
                    <div className="bg-[#fabd2f] text-[#282828] px-3 font-medium border-l border-[#504945]">
                        utf-8 100%
                    </div>
                </div>
            );
        }

        function App() {
            const [expandedFolders, setExpandedFolders] = useState({
                'jacob-pettit/': true,
                'research/': true,
                'publications/': true,
            });
            const [selectedFile, setSelectedFile] = useState('about_me.md');
            const [openTabs, setOpenTabs] = useState(['about_me.md']);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [mobileView, setMobileView] = useState('editor');
            const [showCursor, setShowCursor] = useState(true);
            const [statusMessage, setStatusMessage] = useState('');
            const [sidebarExpanded, setSidebarExpanded] = useState(false);
            const [isMobile, setIsMobile] = useState(false);

            useEffect(() => {
                const interval = setInterval(() => {
                    setShowCursor(prev => !prev);
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                const checkMobile = () => {
                    const mobile = window.innerWidth < 768;
                    setIsMobile(mobile);
                    setSidebarExpanded(!mobile);
                };
                
                checkMobile();
                window.addEventListener('resize', checkMobile);
                return () => window.removeEventListener('resize', checkMobile);
            }, []);

            useEffect(() => {
                const handleOpenFile = (e) => {
                    const fileName = e.detail;
                    if (fileContent[fileName]) {
                        handleFileSelect(fileName);
                    }
                };
                window.addEventListener('openFile', handleOpenFile);
                return () => window.removeEventListener('openFile', handleOpenFile);
            }, [openTabs, selectedFile]);

            useEffect(() => {
                if (statusMessage) {
                    const timer = setTimeout(() => setStatusMessage(''), 3000);
                    return () => clearTimeout(timer);
                }
            }, [statusMessage]);

            const handleFileSelect = (fileName) => {
                setSelectedFile(fileName);
                if (!openTabs.includes(fileName)) {
                    setOpenTabs([...openTabs, fileName]);
                }
                setMobileView('editor');
                setStatusMessage('');
            };

            const handleCloseTab = (fileName, e) => {
                e.preventDefault();
                const newTabs = openTabs.filter(tab => tab !== fileName);
                setOpenTabs(newTabs);
                if (selectedFile === fileName && newTabs.length > 0) {
                    const newSelected = newTabs[newTabs.length - 1];
                    setSelectedFile(newSelected);
                    setStatusMessage(`${fileName} closed`);
                } else if (newTabs.length === 0) {
                    setSelectedFile('');
                    setStatusMessage(`${fileName} closed`);
                }
            };

            const currentFile = fileContent[selectedFile];

            return (
                <div className="h-screen flex flex-col overflow-hidden bg-[#282828]">
                    <div className="hidden md:flex items-center bg-[#282828] px-4 py-2 border-b border-[#504945]">
                        <span className="text-[#fabd2f] font-bold">~ jacob-pettit</span>
                        <span className="text-[#ebdbb2] mx-2">/</span>
                        <span className="text-[#ebdbb2]">
                            {currentFile ? currentFile.title : 'No file'}
                        </span>
                    </div>

                    <div className="flex-1 flex overflow-hidden">
                        <Sidebar
                            fileTree={fileTree}
                            expandedFolders={expandedFolders}
                            setExpandedFolders={setExpandedFolders}
                            selectedFile={selectedFile}
                            setSelectedFile={handleFileSelect}
                            sidebarExpanded={sidebarExpanded}
                            setSidebarExpanded={setSidebarExpanded}
                        />
                        
                        <div className="flex-1 flex flex-col overflow-hidden bg-[#282828] relative">
                            <div className="flex bg-[#282828] border-b border-[#504945] overflow-x-auto">
                                {openTabs.map(tab => (
                                    <BufferTab
                                        key={tab}
                                        file={fileContent[tab]}
                                        isActive={selectedFile === tab}
                                        onClose={(e) => handleCloseTab(tab, e)}
                                        onClick={() => setSelectedFile(tab)}
                                    />
                                ))}
                            </div>
                            
                            <div className="flex-1 overflow-hidden">
                                <EditorContent file={fileContent[selectedFile]} content={currentFile} />
                            </div>
                        </div>
                    </div>

                    <StatusLine selectedFile={selectedFile} openTabs={openTabs} message={statusMessage} />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
